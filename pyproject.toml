[project]
name = "phantomcore"
version = "0.1.0"
description = "Discord bot core for Phantom's server"
readme = "README.md"
authors = [
    { name = "Phantom" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.7.1",
    "lmstudio>=1.5.0",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.3",
    "wavelink>=3.5.2",
]

[project.scripts]
phantomcore = "phantomcore:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
