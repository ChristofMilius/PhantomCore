server:
  port: 7867
  address: 127.0.0.1
  http2:
    enabled: true

lavalink:
  server:
    password: "changeme" # placeholder only: LAVALINK_SERVER_PASSWORD env overrides this at spawn; never the real secret
    sources:
      youtube: false # provided by the youtube plugin below
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    gc-warnings: true
    #ratelimit:
      #ipBlocks: ["1.0.0.0/8", "..."]
      #excludedIps: ["...", "..."]
      #strategy: "RotateOnBan"
      #searchTriggersFail: true
      #retryLimit: -1
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "PhantomCore"
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - ANDROID
      - ANDROID_MUSIC
      - MWEB
      - TVHTML5_SIMPLY
      - TV
      - IOS

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30